# Admin stats page for embry.dev at admin.embry.dev, behind Cloudflare Access (one-time email code).
# Fails closed: until TEAM_DOMAIN, POLICY_AUD (below) and the ADMIN_EMAILS secret are set, every request gets a 503.
# Setup steps: README.md. Deploy: npx wrangler deploy (from this folder). Test: node test/access.test.mjs
name = "embry-admin"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [{ pattern = "admin.embry.dev", custom_domain = true }]

[vars]
TEAM_DOMAIN = "fancy-cloud-bec2.cloudflareaccess.com"
POLICY_AUD = "48f41cda694b90c6b1dd05d16812ae0efa78c4c48a1f4a8b77ee09e2d3a571b2"   # Access app "embry.dev admin"
# ADMIN_EMAILS is a secret, not here (this repo is public): npx wrangler secret put ADMIN_EMAILS  (comma list of emails)

[[d1_databases]]
binding = "DB"
database_name = "embry-downloads"
database_id = "c8f18b47-dac5-4c3c-ad25-115a84d85e29"
